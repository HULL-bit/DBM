name: dbm_mobile
description: Daara Barakatul Mahaahidi - Application Mobile
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.0

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  badges: ^3.1.2

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  image_picker: ^1.0.7
  http_parser: ^4.0.2
  file_picker: ^8.0.0
  open_file: ^3.3.2
  path_provider: ^2.1.4
  syncfusion_flutter_pdfviewer: ^27.2.5

  # Messages vocaux (Canaux / Messagerie)
  record: ^6.0.0
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/images/logo.png"
  web:
    generate: false
  windows:
    generate: false
  linux:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
